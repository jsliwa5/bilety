version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: tickets_postgres
    environment:
      POSTGRES_USER: tickets_user
      POSTGRES_PASSWORD: tickets_password
      POSTGRES_DB: tickets_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: tickets_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672" # Management UI
    volumes:
      - ./ticket-provider/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./ticket-provider/definitions.json:/etc/rabbitmq/definitions.json:ro
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

volumes:
  postgres_data:
  rabbitmq_data:

